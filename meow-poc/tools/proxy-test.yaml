# SOCKS5 proxy egress test. Requires the host-side test server:
#   adb reverse tcp:1080 tcp:1080
#   python3 tools/socks5_server.py --listen 127.0.0.1 --port 1080
# then push this file over files/config.yaml.
mode: rule
log-level: info
dns:
  enable: true
  listen: ""
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: [223.5.5.5]
  nameserver: ["tcp://223.5.5.5", "tcp://119.29.29.29"]
proxies:
  - name: lan-socks
    type: socks5
    server: 127.0.0.1
    port: 1080
rules:
  - MATCH,lan-socks
